<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projeto Web Design</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Meu Projeto de Web Design</h1>
    </header>

    <main>
      <section id="info">
        <h2>Seção de Informações</h2>
        <p id="paragrafo">Aqui será exibida alguma informação dinâmica.</p>
        <button id="btn-alert">Clique para alert</button>
        <button id="btn-date">Mostrar data</button>
        <button id="btn-random">Número aleatório</button>
        <input type="text" id="input-nome" placeholder="Digite seu nome" />
        <button id="btn-nome">Mostrar nome</button>
      </section>

      <section id="lista">
        <h2>Lista de Itens</h2>
        <ul id="itens-lista"></ul>
        <button id="btn-add-item">Adicionar Item</button>
      </section>

      <section id="contador">
        <h2>Contador</h2>
        <p id="contador-display">0</p>
        <button id="btn-increment">Incrementar</button>
        <button id="btn-reset">Resetar</button>
      </section>
    </main>

    <footer>
      <p>Projeto de Web Design - 2025</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
